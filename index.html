<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>liuyiportfolio2026</title>
    <script>
  (function () {
    var params = new URLSearchParams(window.location.search);
    var p = params.get("p");
    var q = params.get("q");

    // ✅ 必须与你 vite.config.js 的 base 一致
    var repo = "/UIUXPortfolio2026";

    if (p) {
      // p 通常是 "/lumi" 这种站内路径
      var newPath = repo + p + (q ? "?" + q : "");
      window.history.replaceState(null, "", newPath);
    }
  })();
</script>


  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
