<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Redirecting…</title>
    <script>
      (function () {
        var repo = "/UIUXPortfolio2026";
        var l = window.location;

        // l.pathname: "/UIUXPortfolio2026/lumi"
        // rest: "/lumi"
        var rest = l.pathname.startsWith(repo) ? l.pathname.slice(repo.length) : l.pathname;

        // Put the intended path into query string: "?p=/lumi"
        // Keep existing search if any (rare on 404), store it too.
        var newUrl = repo + "/?p=" + encodeURIComponent(rest) + "&q=" + encodeURIComponent(l.search || "");
        l.replace(newUrl);
      })();
    </script>
  </head>
  <body></body>
</html>
