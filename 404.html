<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Redirecting…</title>
    <script>
      (function () {
        var repo = "/UIUXPortfolio2026";
        var l = window.location;

        // "/UIUXPortfolio2026/lumi" -> "/lumi"
        var path = l.pathname.startsWith(repo) ? l.pathname.slice(repo.length) : l.pathname;

        // redirect to "/UIUXPortfolio2026/?p=/lumi"
        l.replace(repo + "/?p=" + encodeURIComponent(path) + (l.search ? "&q=" + encodeURIComponent(l.search) : ""));
      })();
    </script>
  </head>
  <body></body>
</html>
